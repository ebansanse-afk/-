<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PARTY PARROT HYPER SPIN</title>
<style>
:root{--heat:0}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#101027;color:#fff;touch-action:none}body{background:radial-gradient(circle at 50% 45%,#302060,#101027 70%);user-select:none}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:14px 16px 18px;gap:10px;position:relative;overflow:hidden}h1{font-size:clamp(18px,5vw,26px);margin:0;text-align:center;letter-spacing:1px;text-shadow:0 0 15px #ff35c9}.sub{font-size:12px;opacity:.75;margin-top:-7px}.readout{width:min(560px,100%);border:2px solid hsl(calc(190 - var(--heat)*1.8),100%,60%);border-radius:18px;padding:10px 14px;background:#080818bb;box-shadow:0 0 calc(8px + var(--heat)*.35px) hsl(calc(190 - var(--heat)*1.8),100%,55%);transition:border-color .15s,box-shadow .15s}.speedline{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.speed{font-size:clamp(22px,7vw,39px);font-weight:900;letter-spacing:-1px;white-space:nowrap}.unit{font-size:12px;opacity:.8}.laps{font-size:12px;white-space:nowrap;color:#f7d7ff}.track{height:11px;background:#292440;border-radius:99px;overflow:hidden;margin-top:8px;border:1px solid #ffffff22}.bar{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,#4deaff,#b8ff46,#ffe34d,#ff5a32,#ff25b9);transition:width .12s}.arena{flex:1;width:min(560px,100%);min-height:180px;display:grid;place-items:center;position:relative;isolation:isolate}.ring{width:min(68vw,310px);aspect-ratio:1;border:2px dashed #ffffff45;border-radius:50%;position:absolute;box-shadow:0 0 25px #9b5bff20;pointer-events:none}.ring:before{content:'TRACE A CIRCLE';position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:10px;letter-spacing:3px;opacity:.55;white-space:nowrap}.parrot{font-size:clamp(76px,24vw,130px);line-height:1;filter:drop-shadow(0 0 15px #ff2dbb);transform:rotate(0deg);will-change:transform;pointer-events:none;z-index:2}.parrot:after{content:'🕶️';font-size:.34em;position:absolute;top:18%;left:38%;transform:rotate(-12deg)}.hint{position:absolute;bottom:8px;text-align:center;font-size:13px;line-height:1.6;opacity:.82;pointer-events:none}.hint strong{color:#ffe66b}.controls{display:flex;gap:8px;width:min(560px,100%);justify-content:center}.btn{border:1px solid #ffffff35;border-radius:12px;padding:10px 16px;background:#ffffff12;color:white;font-weight:700;font-size:13px}.btn:active{transform:scale(.97)}.heatlabel{font-size:11px;text-align:center;margin-top:4px;letter-spacing:2px;color:#aaf8ff}.toast{position:absolute;top:42%;font-size:clamp(20px,6vw,32px);font-weight:1000;text-align:center;text-shadow:0 0 18px #ff24c8;opacity:0;pointer-events:none;z-index:4}.toast.show{animation:pop .7s ease-out}@keyframes pop{0%{opacity:0;transform:scale(.5)}25%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}body.hot{animation:shake .14s infinite alternate}body.hot .arena{filter:saturate(1.7)}@keyframes shake{from{transform:translate(0,0)}to{transform:translate(.7px,-.6px)}}#ending{display:none;position:absolute;inset:0;z-index:10;background:radial-gradient(circle,#6615a4,#080716 70%);overflow:hidden;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}#ending h2{font-size:clamp(28px,8vw,54px);margin:0;text-shadow:0 0 20px #ff00d4;z-index:2}#ending p{z-index:2;font-weight:800}#swarm{position:absolute;inset:0;overflow:hidden}.mini{position:absolute;font-size:clamp(24px,8vw,52px);animation:orbit linear infinite;filter:drop-shadow(0 0 8px #ff4be8)}@keyframes orbit{from{transform:rotate(0deg) translateX(var(--r)) rotate(0deg)}to{transform:rotate(360deg) translateX(var(--r)) rotate(-360deg)}}.again{z-index:3;border:0;border-radius:999px;padding:14px 24px;background:linear-gradient(90deg,#ff2eaa,#ff9c35);color:#160624;font-weight:1000;font-size:16px;margin-top:10px}
</style></head><body><main id="app"><h1>🦜 PARTY PARROT HYPER SPIN 🦜</h1><div class="sub">指で円を描け。宇宙の限界を超えろ。</div><section class="readout"><div class="speedline"><div><div class="unit">PARROT ROTATION SPEED</div><div class="speed"><span id="speed">0</span> <span class="unit">km/h</span></div></div><div class="laps"><span id="laps">0</span> 周<br>HEAT <span id="heatnum">0</span>%</div></div><div class="track"><div class="bar" id="bar"></div></div><div class="heatlabel" id="heatlabel">COOL 🧊</div></section><section class="arena" id="arena"><div class="ring"></div><div class="parrot" id="parrot">🦜</div><div class="toast" id="toast">NICE SPIN!!</div><div class="hint">画面の上で指を<strong>円状になぞる</strong><br>一周するたびに加速！</div></section><div class="controls"><button class="btn" id="reset">↻ 最初から</button><button class="btn" id="sound">🔊 効果音 OFF</button></div><div class="sub">目標：100,000,000 km/h</div></main><section id="ending"><div id="swarm"></div><h2>🌌 PARROT OVERDRIVE 🌌</h2><p>100,000,000 km/h 到達！！<br>もはや誰にも止められない。</p><button class="again" id="again">もう一度回す！</button></section>
<script>
(()=>{const target=100000000;let speed=0,laps=0,angle=null,totalAngle=0,lastAngle=null,drag=false,sound=false,ac=null,ended=false;const $=id=>document.getElementById(id);const app=$('app'),parrot=$('parrot'),arena=$('arena');function audio(freq=440,dur=.08){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();let o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=freq;g.gain.value=.045;o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.stop(ac.currentTime+dur)}catch(e){}}
function update(){let pct=Math.min(100,speed/target*100),heat=Math.min(100,Math.pow(pct/100,.48)*100);$('speed').textContent=Math.floor(speed).toLocaleString('en-US');$('laps').textContent=laps;$('heatnum').textContent=Math.floor(heat);$('bar').style.width=pct+'%';document.documentElement.style.setProperty('--heat',heat);let labels=heat<15?'COOL 🧊':heat<35?'WARMING UP 🌤️':heat<60?'HOT 🔥':heat<80?'EXTREME HEAT 🌋':heat<97?'MELTDOWN IMMINENT ☢️':'REALITY IS BREAKING 💥';$('heatlabel').textContent=labels;document.body.classList.toggle('hot',heat>68);if(heat>85)parrot.style.filter=`drop-shadow(0 0 ${10+heat/2}px hsl(${330-heat},100%,60%))`;else parrot.style.filter='drop-shadow(0 0 15px #ff2dbb)';}
function lap(){laps++;speed=Math.min(target,Math.max(speed+Math.max(1,speed*.24),Math.pow(1.75,laps)*1.8));$('toast').classList.remove('show');void $('toast').offsetWidth;$('toast').textContent=laps%5===0?'ABSOLUTE PARROT CHAOS!!':laps%3===0?'MEGA SPIN!!':'NICE SPIN!!';$('toast').classList.add('show');audio(Math.min(1300,250+laps*50),.1);update();if(speed>=target)endGame()}
function pos(e){const r=arena.getBoundingClientRect();return {x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2}}
function down(e){if(ended)return;drag=true;lastAngle=null;totalAngle=0;const p=pos(e);lastAngle=Math.atan2(p.y,p.x);try{arena.setPointerCapture(e.pointerId)}catch(_){} }
function move(e){if(!drag||ended)return;const p=pos(e),a=Math.atan2(p.y,p.x);if(lastAngle!==null){let d=a-lastAngle;if(d>Math.PI)d-=2*Math.PI;if(d< -Math.PI)d+=2*Math.PI;totalAngle+=d;parrot.style.transform=`rotate(${totalAngle*180/Math.PI}deg) scale(${1+Math.min(.12,Math.abs(d)*.1)})`;if(Math.abs(totalAngle)>=Math.PI*2){let n=Math.floor(Math.abs(totalAngle)/(Math.PI*2));for(let i=0;i<n;i++)lap();totalAngle=totalAngle%(Math.PI*2)}}lastAngle=a}
function up(){drag=false;lastAngle=null;parrot.style.transform=`rotate(${totalAngle*180/Math.PI}deg)`}
function endGame(){ended=true;drag=false;$('ending').style.display='flex';$('swarm').innerHTML='';for(let i=0;i<42;i++){let s=document.createElement('span');s.className='mini';s.textContent=['🦜','🎉','🌈','✨'][i%4];s.style.left=(Math.random()*100)+'%';s.style.top=(Math.random()*100)+'%';s.style.setProperty('--r',(25+Math.random()*130)+'px');s.style.animationDuration=(1.2+Math.random()*4)+'s';s.style.animationDelay=(-Math.random()*4)+'s';$('swarm').appendChild(s)}for(let i=0;i<8;i++)setTimeout(()=>audio(500+i*100,.25),i*100)}
function reset(){speed=0;laps=0;ended=false;totalAngle=0;drag=false;lastAngle=null;parrot.style.transform='rotate(0deg)';$('ending').style.display='none';update()}
arena.addEventListener('pointerdown',down);arena.addEventListener('pointermove',move);arena.addEventListener('pointerup',up);arena.addEventListener('pointercancel',up);$('reset').addEventListener('click',reset);$('again').addEventListener('click',reset);$('sound').addEventListener('click',()=>{sound=!sound;$('sound').textContent=sound?'🔊 効果音 ON':'🔊 効果音 OFF';if(sound)audio(660)});update();})();
</script></body></html>
